apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: vllm
spec:
  replicas: 1
  progressDeadlineSeconds: 3600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      enableServiceLinks: false
      tolerations:
        - key: gpu
          value: amd
          effect: NoSchedule
      nodeSelector:
        kubernetes.io/hostname: talos-wwr-4t6
      containers:
        - name: vllm
          # Image tag and container args are set per-model via the selected
          # kustomize component (see apps/vllm/models/*).
          image: vllm/vllm-openai-rocm:placeholder
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-hf-token
                  key: token
          securityContext:
            seccompProfile:
              type: Unconfined
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "8"
              memory: 100Gi
              amd.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 120Gi
              amd.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: vllm-cache
              mountPath: /root/.cache/vllm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: hf-cache
          hostPath:
            path: /var/lib/vllm/hf-cache
            type: DirectoryOrCreate
        - name: vllm-cache
          hostPath:
            path: /var/lib/vllm/vllm-cache
            type: DirectoryOrCreate
