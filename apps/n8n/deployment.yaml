apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      containers:
        - name: n8n
          image: docker.n8n.io/n8nio/n8n:latest
          ports:
            - containerPort: 5678
            - containerPort: 5679
          env:
            - name: N8N_PORT
              value: "5678"
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: encryption-key
            - name: N8N_RUNNERS_ENABLED
              value: "true"
            - name: N8N_RUNNERS_MODE
              value: "external"
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: runners-auth-token
            - name: N8N_RUNNERS_AUTH_CONTENTS
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: runners-auth-token
            - name: N8N_RUNNERS_BROKER_LISTEN_ADDRESS
              value: "0.0.0.0"
            - name: TAILNET_NAME
              valueFrom:
                secretKeyRef:
                  name: tailscale-config
                  key: tailnet-name
            - name: N8N_HOST
              value: "n8n.$(TAILNET_NAME)"
            - name: WEBHOOK_URL
              value: "https://n8n.$(TAILNET_NAME)/"
            - name: DB_TYPE
              value: "postgresdb"
            - name: DB_POSTGRESDB_HOST
              value: "n8n-db-rw"
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              value: "n8n"
            - name: DB_POSTGRESDB_USER
              value: "n8n"
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-db-creds
                  key: password
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

        - name: n8n-runner
          image: n8nio/runners:latest
          env:
            - name: N8N_RUNNERS_TASK_BROKER_URI
              value: "http://localhost:5679"
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: runners-auth-token
            - name: N8N_RUNNERS_AUTH_CONTENTS
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: runners-auth-token
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"

      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-pvc
