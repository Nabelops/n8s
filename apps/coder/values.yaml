coder:
  env:
    - name: CODER_PG_CONNECTION_URL
      valueFrom:
        secretKeyRef:
          name: coder-db-url
          key: url
    - name: CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLE
      value: "false"
    - name: CODER_ACCESS_URL
      value: "https://coder.tailf95ba8.ts.net"
  service:
    type: ClusterIP
  ingress:
    enable: true
    host: "coder.tailf95ba8.ts.net"
    className: tailscale
    annotations:
      tailscale.com/hostname: coder
    tls:
      enable: true
