apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-db
  namespace: forgejo
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17

  storage:
    size: 5Gi
    storageClass: longhorn

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
      secret:
        name: forgejo-db-creds
