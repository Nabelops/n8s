apiVersion: batch/v1
kind: CronJob
metadata:
  name: vaultwarden-backup
  namespace: vaultwarden
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: backup
            image: postgres:17-alpine
            command:
            - /bin/sh
            - -c
            - |
              TS=$(date +%Y%m%d-%H%M%S)
              BACKUP_DIR="/backup/$TS"
              mkdir -p "$BACKUP_DIR"
              echo "Starting backup to $BACKUP_DIR..."
              
              # Backup PostgreSQL database
              pg_dump "$DATABASE_URL" > "$BACKUP_DIR/db.sql"
              
              [ -f /data/config.json ] && cp /data/config.json "$BACKUP_DIR/"
              [ -f /data/rsa_key.pem ] && cp /data/rsa_key.pem "$BACKUP_DIR/"
              [ -f /data/rsa_key.pub.pem ] && cp /data/rsa_key.pub.pem "$BACKUP_DIR/"
              if [ -d /data/attachments ]; then
                tar czf "$BACKUP_DIR/attachments.tar.gz" -C /data attachments
              fi
              echo "Backup completed. Cleaning up old backups..."
              find /backup -maxdepth 1 -type d -mtime +7 -exec rm -rf {} \;
              echo "Cleanup done."
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-db-creds
                  key: uri
            volumeMounts:
            - name: vw-data
              mountPath: /data
              readOnly: true
            - name: vw-backup
              mountPath: /backup
          restartPolicy: OnFailure
          volumes:
          - name: vw-data
            persistentVolumeClaim:
              claimName: vaultwarden-pvc
          - name: vw-backup
            persistentVolumeClaim:
              claimName: vaultwarden-backup-pvc
