apiVersion: v1
kind: ConfigMap
metadata:
  name: vaultwarden-migration-load
  namespace: vaultwarden
data:
  migration.load: |
    LOAD DATABASE
         FROM sqlite:///sqlite/db.sqlite3
         INTO postgresql://${USERNAME}:${PASSWORD}@vaultwarden-db-rw/vaultwarden

     WITH include drop, create tables, create indexes, reset sequences, data only

      SET work_mem = '128MB', maintenance_work_mem = '256MB';
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vaultwarden-migration
  namespace: vaultwarden
spec:
  template:
    spec:
      containers:
      - name: pgloader
        image: dimitri/pgloader:latest
        command:
        - /bin/sh
        - -c
        - |
          # Replace placeholders in the load file
          cp /config/migration.load /tmp/migration.load
          sed -i "s/\${USERNAME}/$USERNAME/g" /tmp/migration.load
          sed -i "s/\${PASSWORD}/$PASSWORD/g" /tmp/migration.load
          
          # Run pgloader
          pgloader --verbose --debug /tmp/migration.load
        env:
        - name: USERNAME
          valueFrom:
            secretKeyRef:
              name: vaultwarden-db-creds
              key: username
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: vaultwarden-db-creds
              key: password
        volumeMounts:
        - name: sqlite-data
          mountPath: /sqlite
          readOnly: true
        - name: config
          mountPath: /config
          readOnly: true
      restartPolicy: OnFailure
      volumes:
      - name: sqlite-data
        persistentVolumeClaim:
          claimName: vaultwarden-pvc
      - name: config
        configMap:
          name: vaultwarden-migration-load
