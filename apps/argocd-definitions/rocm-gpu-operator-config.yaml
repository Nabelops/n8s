apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rocm-gpu-operator-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Nabelops/n8s.git
    targetRevision: HEAD
    path: apps/rocm-gpu-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
