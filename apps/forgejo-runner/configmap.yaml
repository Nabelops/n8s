apiVersion: v1
kind: ConfigMap
metadata:
  name: runner-config
  namespace: forgejo-runner
data:
  config.yml: |
    log:
      level: info
      job_level: info

    runner:
      file: /data/.runner
      capacity: 1
      timeout: 3h
      shutdown_timeout: 3h
      fetch_timeout: 5s
      fetch_interval: 2s
      report_interval: 1s
      labels:
        - "ubuntu-latest:docker://node:22-bookworm"
        - "ubuntu-22.04:docker://node:22-bookworm"
        - "ubuntu-20.04:docker://node:20-bookworm"

    cache:
      enabled: true
      dir: "/data/.cache"
      host: ""
      port: 0
      proxy_port: 0

    container:
      network: ""
      enable_ipv6: false
      privileged: false
      docker_host: "automount"
      force_pull: false
      force_rebuild: false
      options: "--add-host git.tailf95ba8.ts.net:100.108.136.1"
