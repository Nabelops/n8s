apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OPENAI_API_BASE_URLS
              value: "http://vllm-api.vllm.svc.cluster.local:8000/v1"
            - name: OPENAI_API_KEYS
              value: "unused"
            - name: WEBUI_AUTH
              value: "true"
            - name: OAUTH_PROVIDER_NAME
              value: "Pocket ID"
            - name: OAUTH_CLIENT_ID
              value: "7024e6e9-9107-4dd6-a6fa-8b6b737233fa"
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: OAUTH_CLIENT_SECRET
            - name: OPENID_PROVIDER_URL
              value: "https://auth.tailf95ba8.ts.net/.well-known/openid-configuration"
            - name: OAUTH_SCOPES
              value: "openid email profile"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: HF_TOKEN
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "4Gi"
              cpu: "2"
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
