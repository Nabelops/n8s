apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik
  namespace: authentik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentik
  template:
    metadata:
      labels:
        app: authentik
    spec:
      containers:
        - name: server
          image: ghcr.io/goauthentik/server:2026.2
          args: ["server"]
          envFrom:
            - secretRef:
                name: authentik-secrets
            - secretRef:
                name: authentik-db-creds
          env:
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: "authentik-db-rw"
            - name: AUTHENTIK_POSTGRESQL__NAME
              value: "authentik"
            - name: AUTHENTIK_POSTGRESQL__USER
              value: "authentik"
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-db-creds
                  key: password
          ports:
            - name: http
              containerPort: 9000
            - name: https
              containerPort: 9443
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"

        - name: worker
          image: ghcr.io/goauthentik/server:2026.2
          args: ["worker"]
          envFrom:
            - secretRef:
                name: authentik-secrets
            - secretRef:
                name: authentik-db-creds
          env:
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: "authentik-db-rw"
            - name: AUTHENTIK_POSTGRESQL__NAME
              value: "authentik"
            - name: AUTHENTIK_POSTGRESQL__USER
              value: "authentik"
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-db-creds
                  key: password
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
